  <rect x="530" y="392" width="362" height="70" rx="14" fill="#16213b" stroke="#2a3858"/>

  <text x="550" y="446" class="s muted">AKS · same code, same config</text>

  <rect x="530" y="510" width="362" height="150" rx="14" fill="#0b2a3a" stroke="#22D3EE" stroke-width="2"/>
  <text x="550" y="540" class="h3">Azure Managed Redis</text>
  <text x="550" y="563" class="s muted">Balanced B20 · 24 GB · HA (2 zones)</text>
  <text x="550" y="590" class="b">• same data, writable here too</text>
  <text x="550" y="614" class="b">• serves West Coast in &lt; 1 ms</text>
  <text x="550" y="638" class="s muted">conflict-free (CRDT) merge</text>
  <rect x="530" y="676" width="362" height="52" rx="12" fill="#16213b" stroke="#2a3858"/>
  <text x="550" y="708" class="b">Azure OpenAI · only on cache miss</text>

  <rect x="1028" y="392" width="362" height="70" rx="14" fill="#16213b" stroke="#2a3858"/>

  <text x="1048" y="563" class="s muted">3 shards × highmem-medium + 1 replica each</text>

  <text x="1048" y="614" class="b">• semantic cache (vector search)</text>
  <text x="1048" y="638" class="s muted">cluster mode · multi-zone · volatile-lru</text>
  <rect x="1028" y="676" width="362" height="52" rx="12" fill="#16213b" stroke="#2a3858"/>
  <text x="1048" y="700" class="b">Vertex AI (Gemini) on miss</text>
  <text x="1048" y="720" class="s muted">BigQuery → Dataflow refreshes features</text>

  <rect x="1446" y="344" width="410" height="400" rx="18" fill="#111a2f" stroke="#2a3858" stroke-dasharray="6 6"/>

  <text x="1490" y="446" class="s muted">GKE · scaled down until failover</text>

  <text x="1490" y="638" class="s muted">asynchronous replication</text>
  <rect x="1470" y="676" width="362" height="52" rx="12" fill="#16213b" stroke="#2a3858"/>
  <text x="1490" y="708" class="b">Vertex AI · regional endpoint</text>

  <text x="1429" y="574" class="s" text-anchor="middle" style="fill:#F9A8D4">one-</text>
  <text x="1429" y="610" class="s" text-anchor="middle" style="fill:#F9A8D4">way</text>

    <path d="M792,978 L842,978" stroke="#93A0B8" stroke-width="2.5" marker-end="url(#ah)"/>
    <rect x="844" y="950" width="330" height="56" rx="12" fill="#16213b" stroke="#2a3858"/><text x="1009" y="985" class="b" text-anchor="middle">terraform plan (OIDC, no keys)</text>
    <path d="M1174,978 L1224,978" stroke="#93A0B8" stroke-width="2.5" marker-end="url(#ah)"/>

    <path d="M1526,978 L1576,978" stroke="#93A0B8" stroke-width="2.5" marker-end="url(#ah)"/>
    <rect x="1578" y="950" width="280" height="56" rx="12" fill="#16213b" stroke="#2a3858"/><text x="1718" y="985" class="b" text-anchor="middle">azurerm + google</text>
